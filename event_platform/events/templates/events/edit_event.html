<!DOCTYPE html>
<html>
<head>
    <title>Edit Event</title>
</head>
<body>

    <h1>Edit {{ event.eventName }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div>
            <label>Event Title:</label>
            <input type="text" name="title" value="{{ event.eventName }}" required>
        </div>

        <div>
            <label>Description:</label>
            <textarea name="description" required>{{ event.description }}</textarea>
        </div>

        <div>
            <label>Start Time:</label>
            <input type="datetime-local" name="startTime" value="{{ start_time }}" required>
        </div>

        <div>
            <label>End Time:</label>
            <input type="datetime-local" name="endTime" value="{{ end_time }}" required>
        </div>

        <div>
            <label>Venue:</label>
            <input type="text" name="venue" value="{{ event.location }}" required>
        </div>

        <div>
            <label>Event Type:</label>
            <select name="eventType" required>
                {% for type in types %}
                    <option value="{{ type }}" {% if event.status == status %}selected{% endif %}>
                        {{ type }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Maximum Number of Participants:</label>
            <input type="number" name="maxParticipants" min="1" value="{{ event.maxParticipants }}" required>
        </div>

        <div>
            <label>
                <input type="checkbox" name="openToAll" {% if event.openToAll %}checked{% endif %}>
                Open to participants outside of the org
            </label>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'event_detail' event_id=event_id%}">Back to View Event Details</a><br>
    <a href="{% url 'home' %}">Back to Home</a>

</body>
</html>
